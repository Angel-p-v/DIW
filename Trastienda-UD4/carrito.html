<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Mi cesta de la compra</h1>

    <main>
        <section>
            <article>
                <h2>El psicoanalista</h2>
                <img src="./imagenes/" alt="El psicoanalista">
                <p>John Katzenbach</p>
                <p>10,90 €</p>
            </article>
            <article>
                <h2>Harry Potter y la piedra filosofal</h2>
                <img src="./imagenes/" alt="Harry Potter y la piedra filosofal">
                <p>J. K. Rowling</p>
                <p>12,00 €</p>
            </article>
        </section>

        <section>
            <article>
                <h3>Resumen del pedido</h3>
                <p><span>Subtotal:</span> <span>23,20 €</span></p>
                <p><span>Envío:</span> <span>5,99 €</span></p>
                <p><span>Total:</span> <strong>29,19 €</strong></p>
                <button type="button">Continuar</button>
            </article>
        </section>
    </main>
</body>
</html>
